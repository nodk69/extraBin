name: Continuous Integration & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-verification:
    name: Backend Build, Migrations & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run All Backend Tests
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  frontend-verification:
    name: Frontend Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the suite never performs Supabase network calls,
      # but the client module requires the variables to be present.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Strict Mode Check & Production Build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm run test:run

      - name: Documentation Integrity
        run: |
          cd frontend
          npx vitest run src/test/docsExpansion.test.tsx src/test/docsRestructure.test.tsx
