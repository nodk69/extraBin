# performance-tests/artillery/tests/abuse-password-reset.yml
#
# Abuse scenario - password reset token brute force.
#
#   POST /api/v1/auth/password-reset/confirm
#
# The endpoint accepts { token, newPassword } and answers 403 with
# "Password reset token is invalid or has expired." for a bad token. This
# test hammers it with well-formed but random tokens.
#
# Security property under test: NO attempt may ever succeed, and the service
# must never 5xx under the flood. The thresholds encode exactly that:
#
#   http.codes.200 == 0   -> not a single reset was accepted
#   http.codes.5xx == 0   -> no crash under sustained invalid-token traffic
#
#   artillery run --env-file .env tests/abuse-password-reset.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.200 == 0"
      - "http.codes.5xx == 0"
  phases:
    - duration: 60
      arrivalRate: 5
      name: "brute force"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/auth/me"
        capture:
          - header: "x-csrf-token"
            as: "csrf"
        strict: false

scenarios:
  - name: "reset token brute force"
    flow:
      # Per-VU CSRF bootstrap: the token is bound to the session cookie this
      # request sets, so every virtual user needs its own.
      - get:
          url: "/auth/me"
          capture:
            - header: "x-csrf-token"
              as: "csrf"
          strict: false

      - post:
          url: "/auth/password-reset/confirm"
          headers:
            Content-Type: "application/json"
            X-XSRF-TOKEN: "{{ csrf }}"
          json:
            token: "{{ invalidResetToken() }}"
            newPassword: "ArtilleryBruteForce1!"
