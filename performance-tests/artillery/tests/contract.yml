# performance-tests/artillery/tests/contract.yml
#
# Stage 0 - contract check (port of performance-tests/stage0-contract.js).
# One virtual user walks the whole public surface once and asserts the status
# of every endpoint. Run this before any load stage: it proves the endpoints
# exist and return the expected codes before we push traffic at them.
#
#   artillery run --env-file .env tests/contract.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    # Render free tier cold starts can take ~30s; the default 10s aborts.
    timeout: 60
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.5xx == 0"
      - "vusers.failed == 0"
      - "http.response_time.p95 < 30000"
  phases:
    - duration: 1
      arrivalCount: 1
      name: "contract"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }} (Render free tier cold start can take ~30s)"
    - get:
        url: "/auth/me"
        capture:
          - header: "x-csrf-token"
            as: "csrf"
        strict: false

scenarios:
  - name: "public api contract"
    flow:
      # --- website shell -------------------------------------------------
      - get:
          url: "{{ $env.FRONTEND_URL }}/"
          expect:
            - statusCode: 200

      # --- paste reads ----------------------------------------------------
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/raw"
          expect:
            - statusCode: 200
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}.json"
          expect:
            - statusCode: 200
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}.txt"
          expect:
            - statusCode: 200
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/download"
          expect:
            - statusCode: 200
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/download-zip"
          expect:
            - statusCode: 200
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/embed"
          expect:
            - statusCode: 200

      # --- discovery ------------------------------------------------------
      - get:
          url: "/discovery"
          qs:
            page: 0
            size: 5
          expect:
            - statusCode: 200
            - hasProperty: "items"
      - get:
          url: "/discovery"
          qs:
            q: "javascript"
            page: 0
            size: 5
          expect:
            - statusCode: 200

      # --- auth surface (unauthenticated => 401) --------------------------
      - get:
          url: "/auth/me"
          expect:
            - statusCode: 401
