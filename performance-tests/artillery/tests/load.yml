# performance-tests/artillery/tests/load.yml
#
# Stage C - load test (port of performance-tests/k6/tests/load.js).
#
# The k6 stage ramped 25 -> 50 -> 100 -> 200 concurrent VUs with 1-3s of
# think time, i.e. roughly 12 / 25 / 50 / 100 requests per second. Artillery
# schedules arrivals instead of VUs, so the same shape is expressed directly
# as arrivals per second here: 5 / 10 / 20 / 40.
#
#   artillery run --env-file .env tests/load.yml
#
# Health gates: the ensure thresholds below fail the run if the service
# starts returning 5xx or if p95 latency blows past 5s.

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.5xx == 0"
      - "http.response_time.p95 < 5000"
      - "http.response_time.p99 < 15000"
  phases:
    - duration: 30
      arrivalRate: 2
      name: "warmup"
    - duration: 60
      arrivalRate: 5
      name: "stage 1 - 5/s"
    - duration: 60
      arrivalRate: 10
      name: "stage 2 - 10/s"
    - duration: 60
      arrivalRate: 20
      name: "stage 3 - 20/s"
    - duration: 60
      arrivalRate: 40
      name: "stage 4 - 40/s"
    - duration: 10
      arrivalRate: 0
      name: "drain"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/auth/me"
        strict: false

scenarios:
  # Same mix as the k6 suite, write path included (10% of traffic).
  - name: "paste view"
    weight: 55
    flow:
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}"
          expect:
            - statusCode: 200
      - think: 2

  - name: "raw content"
    weight: 15
    flow:
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/raw"
          expect:
            - statusCode: 200
      - think: 2

  - name: "typed api"
    weight: 5
    flow:
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}.json"
          expect:
            - statusCode: 200
      - think: 2

  - name: "download"
    weight: 5
    flow:
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}/download"
          expect:
            - statusCode: 200
      - think: 2

  - name: "discovery feed"
    weight: 10
    flow:
      - get:
          url: "/discovery"
          qs:
            page: "{{ randomPage(3) }}"
            size: 20
          expect:
            - statusCode: 200
      - think: 2

  - name: "anonymous write"
    weight: 10
    flow:
      - get:
          url: "/auth/me"
          capture:
            - header: "x-csrf-token"
              as: "csrf"
          strict: false
      - post:
          url: "/pastes"
          headers:
            Content-Type: "application/json"
            X-XSRF-TOKEN: "{{ csrf }}"
          json:
            title: "{{ uniqueTitle() }}"
            content: "// artillery-loadtest fixture\nconsole.log('hello artillery');\n"
            language: "javascript"
            visibility: "PUBLIC"
            # ONE_HOUR (not NEVER) so the backend's 5-minute
            # ExpirationCleanupScheduler purges the fixture pastes
            # automatically. Rollback = wait ~65 min, no manual SQL.
            expiration: "ONE_HOUR"
      - think: 2
