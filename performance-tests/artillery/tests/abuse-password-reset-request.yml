# performance-tests/artillery/tests/abuse-password-reset-request.yml
#
# Abuse scenario - password reset request flood / user enumeration.
#
#   POST /api/v1/auth/password-reset/request
#
# Two properties under test:
#   1. Enumeration safety - the response must be the same generic 200
#      message for existing and non-existing accounts.
#   2. Rate limiting - the endpoint is limited to 5 requests per 15 minutes
#      per IP, so 429s MUST appear once the bucket is exhausted.
#
# The threshold "http.codes.429 > 0" is the assertion: if the limiter does
# not fire, the flood succeeds and the test fails.
#
# Addresses point at the RFC 6761 `.invalid` TLD, so no real mailbox can
# ever receive a reset mail.
#
#   artillery run --env-file .env tests/abuse-password-reset-request.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.429 > 0"
      - "http.codes.5xx == 0"
  phases:
    - duration: 30
      arrivalRate: 1
      name: "reset request flood"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/auth/me"
        capture:
          - header: "x-csrf-token"
            as: "csrf"
        strict: false

scenarios:
  - name: "reset request flood"
    flow:
      - get:
          url: "/auth/me"
          capture:
            - header: "x-csrf-token"
              as: "csrf"
          strict: false

      - post:
          url: "/auth/password-reset/request"
          headers:
            Content-Type: "application/json"
            X-XSRF-TOKEN: "{{ csrf }}"
          json:
            email: "{{ throwawayEmail() }}"
