# performance-tests/artillery/tests/abuse-discovery-scrape.yml
#
# Abuse scenario - discovery feed scrape.
#
#   GET /api/v1/discovery?page=N&size=20     (no q, no tag)
#
# The search path (/discovery?q=...) is limited to 30 requests per minute per
# IP. The plain feed path has no such limit, so this test walks the feed as
# fast as an anonymous client can and measures what the service actually
# gives away.
#
# Thresholds:
#   http.codes.5xx == 0   -> the feed must survive the scrape
#   http.codes.429 == 0   -> documents the current (unthrottled) behaviour;
#                           if this ever trips, the feed has been limited
#
#   artillery run --env-file .env tests/abuse-discovery-scrape.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.5xx == 0"
      - "http.codes.429 == 0"
  phases:
    - duration: 60
      arrivalRate: 10
      name: "feed scrape"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/auth/me"
        strict: false

scenarios:
  - name: "discovery feed scrape"
    flow:
      - get:
          url: "/discovery"
          qs:
            page: "{{ randomPage(20) }}"
            size: 20
          expect:
            - statusCode: 200
            - hasProperty: "items"
