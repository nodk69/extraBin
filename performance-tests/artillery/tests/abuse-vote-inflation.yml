# performance-tests/artillery/tests/abuse-vote-inflation.yml
#
# Abuse scenario - vote inflation.
#
#   POST /api/v1/pastes/{id}/vote   { "direction": "UP" | "DOWN" }
#
# Anonymous votes are keyed by client IP: 30 per 60s per IP, 60 per 60s per
# authenticated user. This test casts anonymous votes as fast as it can and
# asserts that the limiter bites.
#
# Thresholds:
#   http.codes.429 > 0   -> the vote limiter fired (expected)
#   http.codes.5xx == 0  -> no crash under the flood
#
# Side effect: the fixture paste's upvote count moves while the test runs.
# That is the point of the test; run it against a throwaway paste if the
# count matters.
#
#   artillery run --env-file .env tests/abuse-vote-inflation.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.429 > 0"
      - "http.codes.5xx == 0"
  phases:
    - duration: 60
      arrivalRate: 10
      name: "vote flood"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/auth/me"
        capture:
          - header: "x-csrf-token"
            as: "csrf"
        strict: false

scenarios:
  - name: "vote inflation"
    flow:
      - get:
          url: "/auth/me"
          capture:
            - header: "x-csrf-token"
              as: "csrf"
          strict: false

      - post:
          url: "/pastes/{{ $env.PASTE_ID }}/vote"
          headers:
            Content-Type: "application/json"
            X-XSRF-TOKEN: "{{ csrf }}"
          json:
            direction: "UP"
