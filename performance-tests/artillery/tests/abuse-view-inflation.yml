# performance-tests/artillery/tests/abuse-view-inflation.yml
#
# Abuse scenario - view count inflation.
#
#   GET /api/v1/pastes/{id}
#
# Every read of a public paste bumps its view counter unless the client opts
# out with X-Skip-View-Count. This test reads the same paste as fast as it
# can and then measures how far the counter actually moved.
#
# The before/after sections probe the counter once each; the after section
# prints the delta so the inflation is visible in the run output:
#
#   VIEW INFLATION REPORT: initial=... final=... delta=...
#
# Note: the counter can only grow by one per request, so a delta that tracks
# the request count means the counter is not deduplicated at all.
#
#   artillery run --env-file .env tests/abuse-view-inflation.yml

config:
  target: "{{ $env.API_URL }}"
  http:
    timeout: 60
  processor: "./lib/processors.js"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - "http.codes.5xx == 0"
  phases:
    - duration: 60
      arrivalRate: 10
      name: "view inflation"

before:
  flow:
    - log: "Warming up {{ $env.API_URL }}"
    - get:
        url: "/pastes/{{ $env.PASTE_ID }}"
        capture:
          - json: "$.views"
            as: "initial_views"
        strict: false

after:
  flow:
    - get:
        url: "/pastes/{{ $env.PASTE_ID }}"
        capture:
          - json: "$.views"
            as: "final_views"
        strict: false
    - log: "VIEW INFLATION REPORT: initial={{ initial_views }} final={{ final_views }} delta={{ viewDelta() }}"

scenarios:
  - name: "view inflation"
    flow:
      - get:
          url: "/pastes/{{ $env.PASTE_ID }}"
          expect:
            - statusCode: 200
