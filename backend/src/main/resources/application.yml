spring:
  application:
    name: pastebin-backend
  profiles:
    active: dev
  # Local-dev ergonomics: an (optionally present, uncommitted) .env next to the
  # backend folder/working directory is honored for env-backed settings such as
  # SUPABASE_URL / SUPABASE_ANON_KEY. Production keeps real environment
  # variables from the compose deployment; frontend/.env remains the SPA source.
  config:
    import: "optional:file:./.env[.properties]"
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:${PORT:8080}}
  address: 0.0.0.0
  servlet:
    session:
      cookie:
        name: PASTESESSIONID
        http-only: true
        secure: ${APP_SESSION_SECURE_COOKIE:false}
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:lax}
      timeout: 7d
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

pastebin:
  content:
    max-bytes: ${APP_MAX_PASTE_BYTES:1048576} # 1MB limit
    max-title-length: 100
  cleanup:
    cron: "${APP_CLEANUP_CRON:0 */5 * * * *}"
    batch-size: 500
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}"
  csrf:
    cookie-secure: "${PASTEBIN_CSRF_COOKIE_SECURE:false}"
    cookie-same-site: "${PASTEBIN_CSRF_COOKIE_SAME_SITE:Lax}"
  security:
    trusted-proxies: "${APP_TRUSTED_PROXIES:127.0.0.1,::1}"
    vote-pepper: "${APP_VOTE_PEPPER:}"
  share:
    public-base-url: "${PASTEBIN_SHARE_PUBLIC_BASE_URL:http://localhost:5173}"
    archive-max-entries: ${PASTEBIN_SHARE_ARCHIVE_MAX_ENTRIES:50}
    archive-max-bytes: ${PASTEBIN_SHARE_ARCHIVE_MAX_BYTES:10485760} # 10MB uncompressed limit
    archive-max-output-bytes: ${PASTEBIN_SHARE_ARCHIVE_MAX_OUTPUT_BYTES:10485760} # 10MB compressed output limit
  meilisearch:
    url: "${MEILISEARCH_URL:http://localhost:7700}"
    api-key: "${MEILISEARCH_API_KEY:}"
    index-name: "${MEILISEARCH_INDEX_NAME:public_pastes}"
    enabled: ${MEILISEARCH_ENABLED:false}
    connect-timeout-ms: ${MEILISEARCH_CONNECT_TIMEOUT_MS:2000}

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# Error tracking via Sentry. Leave DSN empty to disable (dev/test).
# Production deployments MUST set SENTRY_DSN to the project's ingest URL.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  traces-sample-rate: 0.1
  send-default-pii: false
