spring:
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pastebin}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:pastebin}}
    # P0-02: fail closed — no default password. Compose always sets
    # SPRING_DATASOURCE_PASSWORD; a bare prod-profile start without the secret now
    # refuses to boot instead of falling back to a hardcoded credential.
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

server:
  servlet:
    session:
      cookie:
        secure: true

# P0-04/P1-20: split actuator onto its own management port in prod. The application
# port (behind nginx) then serves no actuator endpoints at all — the earlier nginx
# block becomes defense in depth rather than the only barrier. Prometheus still
# scrapes 8081 over the internal compose network, which is where APP_TRUSTED_PROXIES
# already assumes internal traffic.
management:
  server:
    # P0-04/P1-20: dedicated management port; kept configurable so deployments can
    # publish it on their own interface. Compose sets MANAGEMENT_PORT=8081.
    port: ${MANAGEMENT_PORT:8081}

# P1-20: OpenAPI/Swagger artifacts are develop-time documents; in prod they are an
# attack-surface map for free. Disable both the generated spec and the UI.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.pastebin: INFO
    org.springframework.web: WARN
